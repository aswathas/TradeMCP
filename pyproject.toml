[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trademcp"
version = "0.1.0"
description = "Free MCP server for Indian market technical + fundamental analysis (NSE/BSE)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TradeMCP contributors" }]
keywords = ["mcp", "india", "nse", "bse", "stocks", "technical-analysis", "fundamentals"]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
trademcp = "trademcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
