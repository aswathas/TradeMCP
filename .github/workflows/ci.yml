name: CI

# The repo's central claim is that it is real and reproducible: 14 tools, 57
# indicators, 54 ratios, and a test suite anyone can run. Nothing executed
# those claims, so a regression could ship silently. This does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject.toml
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the server and the test runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: Run the offline unit tests
        run: python -m pytest tests -q

      - name: Check the package still builds
        run: python -m pip install build && python -m build --wheel --outdir dist/ .

  smoke:
    name: MCP stdio session (live)
    runs-on: ubuntu-latest
    # The smoke test calls the free public endpoints. It proves the server
    # really answers over a real MCP session, but a flaky upstream must not
    # block a merge - the offline suite above is the gate.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the server
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Talk to the server over stdio like an agent would
        run: python scripts/smoke_stdio.py
