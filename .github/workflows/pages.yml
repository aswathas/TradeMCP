name: Deploy showcase to GitHub Pages

# The showcase is a static site with no build step, so the deploy is just
# showcase/site pushed to Pages. Single source of truth: edit the files there,
# this workflow publishes them.

on:
  push:
    branches: [main]
    paths:
      - "showcase/site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/site
      - id: deployment
        uses: actions/deploy-pages@v4
